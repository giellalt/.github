name: Docs
on:
  workflow_call:
    inputs:
      docs_dir:
        description: >
          Path to the Jekyll source, relative to the repo root. Use '.' for a
          repo whose docs live at the repo root instead of a docs/ subdir.
        type: string
        default: 'docs'
      prebuild_script:
        description: >
          Optional path (relative to the repo root) to a script this repo
          owns, run before the Jekyll build. For repo-specific prep — fetching
          data, building Slidev decks, whatever — that doesn't belong in the
          shared workflow. The script installs any extra tools it needs
          itself; Ruby (with the repo's own docs Gemfile) is already set up
          by the time it runs — if the script needs a gem beyond what the
          theme already pulls in (e.g. octokit), add it to that Gemfile.
          Left empty (the default), nothing runs.
        type: string
        default: ''
      postbuild_script:
        description: >
          Same idea as prebuild_script, but run after the Jekyll build and
          Pagefind indexing — for repo-specific content that has to be merged
          into the built site afterward (e.g. copying pre-built Slidev decks
          into _site). The built site is at $GITHUB_WORKSPACE/_site regardless
          of this script's own working directory.
        type: string
        default: ''

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Derive repo type
        id: meta
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_TYPE="${REPO_NAME%%-*}"
          echo "repo-type=$REPO_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected repo type: $REPO_TYPE"

      # --- Checkout giella-core (lang only) ---
      - name: Checkout giella-core
        if: steps.meta.outputs.repo-type == 'lang'
        uses: actions/checkout@v6
        with:
          repository: giellalt/giella-core
          path: giella-core

      # --- Checkout the repo itself ---
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: repo
          fetch-depth: 0

      # --- Repo visibility ---
      # A public repo's docs pages read the generated/docs-data branch (badges,
      # test stats, accuracy report) live from raw.githubusercontent.com. A
      # private repo can't: that host needs auth and sends no CORS header, and
      # shields.io can't read the repo either. So for a private repo we embed a
      # snapshot of the branch into the built site (further down) and the theme
      # loads it same-origin. That staging decision has to be made before the
      # Jekyll build even runs, so jekyll-github-metadata's site.github.private
      # (which the build step now resolves with an authenticated token) isn't
      # available yet — resolve `private` once here with gh instead, and hand
      # it + the canonical owner/repo to the theme via _data/ci.yml.
      - name: Detect repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"

      # --- Lang build ---
      - name: Install minimal dependencies
        if: steps.meta.outputs.repo-type == 'lang'
        run: sudo apt-get update && sudo apt-get install -y gawk bc autoconf

      - name: Build giella-core
        if: steps.meta.outputs.repo-type == 'lang'
        env:
          TERM: dumb
        run: cd giella-core && ./autogen.sh && ./configure --disable-configure-errors && make

      - name: Generate docs
        if: steps.meta.outputs.repo-type == 'lang'
        env:
          TERM: dumb
        run: |
          cd repo
          ./autogen.sh
          mkdir -p build && cd build
          ../configure --without-hfst --without-foma --disable-configure-errors
          make -C docs

      # Generated docs are marked at generation time (giella-core
      # am-shared/docs-dir-include.am injects `generated: true` front matter via
      # scripts/mark-generated.awk), so no git-based marking step is needed.

      # --- Embed generated/docs-data (private repos only) ---
      # See "Detect repo visibility" above. Overlay the branch snapshot after
      # `make -C docs` has run so nothing in the lang build can clobber it; it
      # lands under docs/generated/docs-data/ and Jekyll copies it verbatim into
      # _site, where the theme fetches it same-origin.
      - name: Checkout generated/docs-data (private repos only)
        if: steps.vis.outputs.private == 'true'
        continue-on-error: true   # branch is absent until the first main build publishes it
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: generated/docs-data
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docs-data-branch

      - name: Stage generated/docs-data into the site (private repos only)
        if: steps.vis.outputs.private == 'true'
        run: |
          dest="repo/${{ inputs.docs_dir }}/generated/docs-data"
          mkdir -p "$dest"
          cp -R docs-data-branch/. "$dest/" 2>/dev/null || true
          rm -rf "$dest/.git"
          ls -la "$dest/" || true

      # --- Mermaid processing ---
      - name: Get list of doc files
        id: getfile
        run: |
          echo "files=$(find "repo/${{ inputs.docs_dir }}" -name '*.md' | xargs)" >> "$GITHUB_OUTPUT"

      - name: Compile mermaid
        uses: divvun/compile-mermaid-markdown-action@main
        with:
          files: ${{ steps.getfile.outputs.files }}
          output: 'repo/${{ inputs.docs_dir }}/mermaid-svgs'
        env:
          HIDE_CODEBLOCKS: 1
          ABSOLUTE_IMAGE_LINKS:
          OUTPUT_FILE_TYPE: "svg"

      # --- Theme data from CI ---
      # last_modified.yml: per-page "Last updated" dates.
      # ci.yml: repo visibility + canonical owner/repo, so the theme picks the
      #   generated/docs-data fetch base (raw.githubusercontent.com vs. the
      #   same-origin embedded copy) without trusting jekyll-github-metadata's
      #   token-less `site.github.private`.
      - name: Generate last-modified data
        run: |
          docs_dir="${{ inputs.docs_dir }}"
          src="repo/$docs_dir"
          mkdir -p "$src/_data"
          {
            echo "# Auto-generated by CI — do not edit"
            echo "private: ${{ steps.vis.outputs.private }}"
            echo "repo_nwo: ${{ github.repository }}"
          } > "$src/_data/ci.yml"
          echo "# Auto-generated by CI — do not edit" > "$src/_data/last_modified.yml"
          find "$src" -name "*.md" | while read f; do
            rel="${f#"$src"/}"
            date=$(git -C repo log --follow --format="%ai" -1 -- "$docs_dir/$rel" | cut -c1-10)
            if [ -n "$date" ]; then
              echo "\"$rel\": \"$date\"" >> "$src/_data/last_modified.yml"
            fi
          done

      # --- Build ---
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # CI-only config overlay merged on top of the repo's own docs/_config.yml
      # (compressed Sass, minifier excludes — see jekyll/_ci_overrides.yml).
      # The dependency side of this used to live here too (a shared Gemfile
      # this workflow staged into every repo, out of sync with each repo's own
      # docs/Gemfile used for local `jekyll serve`). Now that jekyll-theme-giellalt
      # is a gem declaring its own dependencies, a repo's docs/Gemfile just
      # depends on that gem and IS what this workflow builds with — no staging,
      # so local and CI are structurally the same file.
      #
      # repository/ref come from the `job` context, not `github` — github.repository
      # and github.workflow_ref both stay pinned to the root/caller workflow even
      # inside a called reusable workflow (confirmed the hard way). job.workflow_repository
      # and job.workflow_sha are the fields GitHub added specifically to identify the
      # reusable workflow file actually executing this job, so this self-checkout
      # always matches whatever ref this workflow was itself called at — @main, a
      # branch, a tag, a pinned SHA — with nothing for a caller to keep in sync.
      - name: Check out the shared CI build-config overlay
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ci
          sparse-checkout: jekyll
          sparse-checkout-cone-mode: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: repo/${{ inputs.docs_dir }}

      # Repo-owned prep this workflow has no business knowing about — fetching
      # data, building Slidev decks, whatever. See the `prebuild_script` input.
      - name: Repo-specific pre-build hook
        if: inputs.prebuild_script != ''
        working-directory: repo
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/repo/${{ inputs.docs_dir }}/Gemfile
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${{ inputs.prebuild_script }}"

      - name: Build with Jekyll
        working-directory: repo          # so jekyll-github-metadata sees .git (build_revision)
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/repo/${{ inputs.docs_dir }}/Gemfile
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # url/baseurl from the Pages deployment, not jekyll-github-metadata
          # (keeps them right regardless of whether it's authenticated).
          cat > "$RUNNER_TEMP/pages.yml" <<EOF
          url: "${{ steps.pages.outputs.origin }}"
          baseurl: "${{ steps.pages.outputs.base_path }}"
          EOF
          bundle exec jekyll build --verbose \
            --source "${{ inputs.docs_dir }}" \
            --destination "$GITHUB_WORKSPACE/_site" \
            --config "${{ inputs.docs_dir }}/_config.yml","$GITHUB_WORKSPACE/ci/jekyll/_ci_overrides.yml","$RUNNER_TEMP/pages.yml"

      - name: Index with Pagefind
        run: npx -y pagefind --site ./_site

      # Runs after Pagefind so repo-specific content merged in here (e.g. a
      # pre-built Slidev deck) isn't expected to already be indexed by it.
      - name: Repo-specific post-build hook
        if: inputs.postbuild_script != ''
        working-directory: repo
        run: bash "${{ inputs.postbuild_script }}"

      # --- Deploy ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
