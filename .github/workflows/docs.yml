name: Docs
on:
  workflow_call:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Derive repo type
        id: meta
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_TYPE="${REPO_NAME%%-*}"
          echo "repo-type=$REPO_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected repo type: $REPO_TYPE"

      # --- Checkout giella-core (lang only) ---
      - name: Checkout giella-core
        if: steps.meta.outputs.repo-type == 'lang'
        uses: actions/checkout@v6
        with:
          repository: giellalt/giella-core
          path: giella-core

      # --- Checkout the repo itself ---
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: repo
          fetch-depth: 0

      # --- Repo visibility ---
      # A public repo's docs pages read the generated/docs-data branch (badges,
      # test stats, accuracy report) live from raw.githubusercontent.com. A
      # private repo can't: that host needs auth and sends no CORS header, and
      # shields.io can't read the repo either. So for a private repo we embed a
      # snapshot of the branch into the built site (further down) and the theme
      # loads it same-origin. jekyll-github-metadata can't be trusted for
      # `private` here (no token passed to the Jekyll build), so resolve it once
      # with gh and hand it + the canonical owner/repo to the theme via
      # _data/ci.yml.
      - name: Detect repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"

      # --- Lang build ---
      - name: Install minimal dependencies
        if: steps.meta.outputs.repo-type == 'lang'
        run: sudo apt-get update && sudo apt-get install -y gawk bc autoconf

      - name: Build giella-core
        if: steps.meta.outputs.repo-type == 'lang'
        env:
          TERM: dumb
        run: cd giella-core && ./autogen.sh && ./configure --disable-configure-errors && make

      - name: Generate docs
        if: steps.meta.outputs.repo-type == 'lang'
        env:
          TERM: dumb
        run: |
          cd repo
          ./autogen.sh
          mkdir -p build && cd build
          ../configure --without-hfst --without-foma --disable-configure-errors
          make -C docs

      # Generated docs are marked at generation time (giella-core
      # am-shared/docs-dir-include.am injects `generated: true` front matter via
      # scripts/mark-generated.awk), so no git-based marking step is needed.

      # --- Embed generated/docs-data (private repos only) ---
      # See "Detect repo visibility" above. Overlay the branch snapshot after
      # `make -C docs` has run so nothing in the lang build can clobber it; it
      # lands under docs/generated/docs-data/ and Jekyll copies it verbatim into
      # _site, where the theme fetches it same-origin.
      - name: Checkout generated/docs-data (private repos only)
        if: steps.vis.outputs.private == 'true'
        continue-on-error: true   # branch is absent until the first main build publishes it
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: generated/docs-data
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docs-data-branch

      - name: Stage generated/docs-data into the site (private repos only)
        if: steps.vis.outputs.private == 'true'
        run: |
          mkdir -p repo/docs/generated/docs-data
          cp -R docs-data-branch/. repo/docs/generated/docs-data/ 2>/dev/null || true
          rm -rf repo/docs/generated/docs-data/.git
          ls -la repo/docs/generated/docs-data/ || true

      # --- Mermaid processing ---
      - name: Get list of doc files
        id: getfile
        run: |
          echo "files=$(find repo/docs -name '*.md' | xargs)" >> "$GITHUB_OUTPUT"

      - name: Compile mermaid
        uses: divvun/compile-mermaid-markdown-action@main
        with:
          files: ${{ steps.getfile.outputs.files }}
          output: 'repo/docs/mermaid-svgs'
        env:
          HIDE_CODEBLOCKS: 1
          ABSOLUTE_IMAGE_LINKS:
          OUTPUT_FILE_TYPE: "svg"

      # --- Theme data from CI ---
      # last_modified.yml: per-page "Last updated" dates.
      # ci.yml: repo visibility + canonical owner/repo, so the theme picks the
      #   generated/docs-data fetch base (raw.githubusercontent.com vs. the
      #   same-origin embedded copy) without trusting jekyll-github-metadata's
      #   token-less `site.github.private`.
      - name: Generate last-modified data
        run: |
          mkdir -p repo/docs/_data
          {
            echo "# Auto-generated by CI — do not edit"
            echo "private: ${{ steps.vis.outputs.private }}"
            echo "repo_nwo: ${{ github.repository }}"
          } > repo/docs/_data/ci.yml
          echo "# Auto-generated by CI — do not edit" > repo/docs/_data/last_modified.yml
          find repo/docs -name "*.md" | while read f; do
            rel="${f#repo/docs/}"
            date=$(git -C repo log --follow --format="%ai" -1 -- "docs/$rel" | cut -c1-10)
            if [ -n "$date" ]; then
              echo "\"$rel\": \"$date\"" >> repo/docs/_data/last_modified.yml
            fi
          done

      # --- Deploy ---
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: repo/docs/
          destination: ./_site

      - name: Index with Pagefind
        run: |
          sudo chown -R $USER:$USER ./_site
          npx -y pagefind --site ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
